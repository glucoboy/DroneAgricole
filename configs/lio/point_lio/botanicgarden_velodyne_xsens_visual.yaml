/**:
  ros__parameters:
    odom_only: false
    odom_header_frame_id: "camera_init"
    odom_child_frame_id: "aft_mapped"
    prop_at_freq_of_imu: true
    use_imu_as_input: true
    check_satu: true
    init_map_size: 100
    space_down_sample: true
    point_filter_num: 4
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    runtime_pos_log_enable: false
    common:
      lid_topic: "/velodyne_points"
      imu_topic: "/imu/data"
      con_frame: false
      con_frame_num: 1
      cut_frame: false
      cut_frame_time_interval: 0.1
      time_lag_imu_to_lidar: 0.0
      lidar_qos_depth: 100
      lidar_qos_reliable: true
    preprocess:
      lidar_type: 2
      scan_line: 16
      scan_rate: 10
      timestamp_unit: 0
      blind: 1.0
    mapping:
      imu_en: true
      start_in_aggressive_motion: false
      extrinsic_est_en: false
      imu_time_inte: 0.0025
      satu_acc: 30.0
      satu_gyro: 35.0
      acc_norm: 9.81
      lidar_meas_cov: 0.01
      acc_cov_output: 500.0
      gyr_cov_output: 1000.0
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      imu_meas_acc_cov: 0.1
      imu_meas_omg_cov: 0.1
      gyr_cov_input: 0.01
      acc_cov_input: 0.1
      vel_cov: 20.0
      plane_thr: 0.1
      match_s: 81.0
      fov_degree: 180.0
      det_range: 100.0
      gravity_align: true
      gravity: [0.0, 0.0, -9.81]
      gravity_init: [0.0, 0.0, -9.81]
      extrinsic_T: [0.0584867781527745, 0.00840419966766332, 0.168915521980526]
      extrinsic_R: [0.999678872580465, 0.0252865664429322, 0.00150422292234868,
                    -0.0252723438960774, 0.999649431893338, -0.0078025434141585,
                    -0.00170103929405540, 0.00776298237926191, 0.99996789371916]
    odometry:
      publish_odometry_without_downsample: false
    publish:
      path_en: true
      scan_publish_en: true
      scan_bodyframe_pub_en: false
    pcd_save:
      pcd_save_en: false
      interval: -1
