  "compatibilite_gel_v1": {
    "portee": "Le moteur v1 valide et gèle les champs de son contrat. Les liaisons de ce dossier représentent des identités fonctionnelles et les axes sont conservés séparément. Cette projection ne sert pas à construire ou à valider des solides.",
    "zeros": "Seuils de criblage purement nominal pour le contrat v1. Aucune tolérance physique ou numérique OCC approuvée. Tout résultat tangent ou indéterminé reste à instruire.",
    "plateaux": "Plans de comparaison historiques à Z85 et Z130,052 dans le repère assemblage, issus de cartographe_action3_rejeu.json. Les boîtes de comparaison proviennent de la même preuve. Ces cotes ne fixent pas un dégagement minimal."
  },
  "exigences_imperatives": [
    {
      "id": "G3A-01",
      "refs": [
        "CAB-CARTO-001",
        "METH-001"
      ],
      "critere": "Réconcilier 71 lignes, 53 axes et 56 associations à double sens. Justifier individuellement les 21 lignes sans axe. Conserver signaux, retours, polarités, détrompages, terminaisons et statuts de périmètre. Une ligne ou un port inconclusif empêche la clôture du domaine concerné.",
      "controle": "Rejeu L2, export netlist KiCad et rapprochement de la BOM connecteur aux identités logiques. Démontrer le mécanisme sur témoin avant ouverture de GO3B puis comparer le candidat GO3B complet à un graphe électrique indépendant rattaché aux natifs."
    },
    {
      "id": "G3A-02",
      "refs": [
        "CAB-CARTO-001"
      ],
      "critere": "Conserver chaîne 6S, protections série, commande PX4, buses et chemins de retour. F31 : CAN1 H/L/GND et aucune injection depuis la broche +5 V de CAN1. Préserver ancrage et extraction PM08 ainsi que l'accès aux points de test.",
      "controle": "Vérifier schéma, continuité, polarité, isolement, courant nominal/crête et déclassement avec les références identifiées. Simuler séquence de montage/dépose CAN1, fiche et outil avec F31/F35/PM08/isolateur en place et chaîne de tolérances."
    },
    {
      "id": "G3A-03",
      "refs": [
        "CAB-CARTO-001",
        "MEC-INT-001"
      ],
      "critere": "F24A doit joindre la bonne embase GPIO et le PPS/retour, avec niveau et référence IO conformes et synchronisation conservée. Vérifier W23 (AIRY/AIRY_SYNC), F24B et F24C avec la population réelle de CA01 et ne pas déduire la continuité des seules étiquettes de nets.",
      "controle": "Identifier révision et instance Holybro, faces et cavités, puis allouer les résistances DNP avant nouveau gel. Démontrer la chaîne temporelle sur le périmètre réceptionné."
    },
    {
      "id": "G3A-04",
      "refs": [
        "CAB-CARTO-001",
        "MEC-INT-001"
      ],
      "critere": "F16 et branche M8 : couvrir le domaine composé de translation/rotation, les jeux et butées, la tenue des prises, le volume balayé et la réserve utile. Préserver champs caméra/LiDAR, géométrie relative, datation et remontée capteurs.",
      "controle": "Comparer poses nominales, extrêmes et intermédiaires justifiées, enveloppe continue, sorties, longueur de cordon et rayons statique/dynamique applicables. Vérifier l'absence d'effet sur P10/P17/P73, F25 et F35. Confirmer cycles et transmission au banc."
    },
    {
      "id": "G3A-05",
      "refs": [
        "CAB-CARTO-001",
        "MEC-INT-001"
      ],
      "critere": "Maintenir l'accès simultané USB et TTL de diagnostic BMS, avec la séparation B− brut/P− et les références de l’isolateur (TTL côté BMS/B− brut, USB côté hôte). L'accès doit être utilisable avec prises, verrou, outil et réserve, sans dépose de la distribution pour l'opération courante.",
      "controle": "Comparer un contrat passif pin à pin au schéma et au côté réellement isolé. Vérifier continuité/isolement et intégrité USB, longueur utile, extraction et ordre de service en présence de F31/F35 et du reste de la baie."
    },
    {
      "id": "G3A-06",
      "refs": [
        "MEC-INT-001"
      ],
      "critere": "Assurer ancrage P75/P85, supports P70/P72/P73, protection des chants et accès aux vis. Préserver structure et zones de propulsion X650, mouvements, champ GNSS/RF, polarisation et dégagement des antennes.",
      "controle": "Relire les natifs et leurs preuves de substitution, identifier la géométrie OEM critique, contrôler appuis et séquence outil, retenue et relâchement sans abrasion. Réserver rigidité, traction et vibration à une démonstration applicable."
    },
    {
      "id": "G3A-07",
      "refs": [
        "MEC-INT-001",
        "CAB-CARTO-001"
      ],
      "critere": "Ne pas créer d'interférence globale par une correction locale. Conserver l'air au ventilateur et ses accès, les branches périphériques, l'accès SSD/CSI, les fonctions batterie, NTC et armement. Garder puissance, signaux sensibles et RF en corridors séparés lorsque le partage n'est pas justifié.",
      "controle": "Contrôler cheminement et enveloppes des groupes, packing, chemin de retour, blindage/CEM, débit de ventilation et dissipation. Justifier explicitement la réservation ou l'exclusion des LED et vérifier qu'aucun port déjà attribué ne soit repris."
    },
    {
      "id": "G3A-08",
      "refs": [
        "MEC-INT-001",
        "METH-001"
      ],
      "critere": "Une cible doit être comparable avec le même périmètre et relier toutes les occurrences affectées à une preuve native fraîche. Aucune violation démontrée ni inconnue critique ouverte pour l'admission GO3B. Masses et inclusions traçables sans doubler câbles, gaines ni agrégats OEM.",
      "controle": "Relire la fermeture XLink sur copie, sauvegarder et rouvrir en contexte indépendant, vérifier l'identité de chaque dépendance, la géométrie et les preuves A–D. Recalculer bilan de masse, centrage, charges et marges à partir des références applicables."
    }
  ],
  "mesures_comparables": {
    "ordre": "Éliminer les violations impératives. Publier séparément les inconnues. Sur périmètre identique, présenter le front des solutions documentées sur chaque objectif comparable et préciser sa couverture avant toute préférence.",
    "couverture": "Nombre de lignes, axes et associations, couverture des broches et des paires de contrôle, inconnues explicites.",
    "encombrement": "Axes cumulés dans la boîte baie, dessus et sous P66, cote haute d'enveloppe, L × l × H de la baie connectée et volume de service, en mm et mm³.",
    "montage": "Sortie et rayon effectif, distance minimale par paire, passage de chaque prise préterminée, outil et réserve utile, quantité de supports et dérivations réellement utilisés.",
    "couts": "Longueur d'axe et quantité de cordons séparées. Masse câbles/protections/fixations, charge CAO/électronique/essais, coût et risque tracés. L'inconnu est null."
  },
