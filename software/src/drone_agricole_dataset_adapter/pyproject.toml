[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-agricole-dataset-adapter"
version = "0.1.0"
description = "Adaptateurs reproductibles des datasets du projet Drone Agricole"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "rosbags==0.11.3",
  "ruamel.yaml>=0.18,<0.20",
]

[project.scripts]
botanicgarden-adapter = "drone_agricole_dataset_adapter.botanicgarden:main"

[tool.setuptools.packages.find]
where = ["src"]
